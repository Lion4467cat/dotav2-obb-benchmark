[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dotav2-oriented-faster-rcnn-benchmark"
version = "1.3.0"
description = "DOTA v2.0 oriented (le90) object-detection benchmark: rotated and Oriented R-CNN tracks, evaluation tooling, and a local inference package"
readme = "README.md"
requires-python = ">=3.10,<3.12"
dependencies = [
    "gdown>=5.2.0",
    "nbformat>=5.10.4",
    "numpy>=1.26.4",
    "pillow>=10.4.0",
    "pyyaml>=6.0.2",
    "requests>=2.32.0",
    "tqdm>=4.66.5",
]

[project.optional-dependencies]
# Local inference UI (also needs torch/mmcv/mmdet/mmrotate; see README).
ui = ["gradio>=4.0"]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.7.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
norecursedirs = ["mmrotate", "artifacts", ".task-data", "graphify-out", ".venv", "dota_obb/__pycache__"]

[tool.ruff.lint]
per-file-ignores = {"configs/*.py" = ["C408"], "*.ipynb" = ["I001", "SIM115"]}

[tool.hatch.build.targets.wheel]
packages = ["dota_obb"]
